<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NiCE2 小卡</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .example-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; }

    /* ===== Y2K 復古電腦視窗風格 ===== */

    .chrome-text {
      font-family: 'Arial Black', 'Microsoft JhengHei', sans-serif;
      font-weight: 900;
      background: linear-gradient(180deg, #ffffff 0%, #d4dde3 18%, #8fa3b0 38%, #ffffff 52%, #6d818e 68%, #eef3f5 86%, #a7b6bf 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-stroke: 0.5px rgba(255,255,255,0.6);
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.45));
      letter-spacing: 0.03em;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(0.75) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.15) rotate(20deg); }
    }
    @keyframes float-y {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse-scale {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }
    @keyframes scan-sweep {
      0% { top: 6%; opacity: 0.2; }
      50% { opacity: 1; }
      100% { top: 90%; opacity: 0.2; }
    }
    @keyframes progress-stripe {
      0% { background-position: 0 0; }
      100% { background-position: 32px 0; }
    }
    @keyframes ripple-out {
      0% { transform: scale(0); opacity: 0.9; }
      100% { transform: scale(1); opacity: 0; }
    }
    @keyframes fade-out {
      to { opacity: 0; visibility: hidden; }
    }

    .sky-bg {
      position: fixed; inset: 0; z-index: 500;
      background:
        radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 35%),
        radial-gradient(ellipse at 80% 75%, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 30%),
        linear-gradient(180deg, #bcd8ef 0%, #cfe4f4 40%, #e8eff5 100%);
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.6s ease;
    }
    .sparkle {
      position: absolute;
      font-size: 22px;
      color: #fff;
      -webkit-text-stroke: 0.5px #9fb3c0;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.35));
      animation: twinkle 2.4s ease-in-out infinite, float-y 4s ease-in-out infinite;
      pointer-events: none;
      user-select: none;
    }

    .retro-window {
      width: min(78vw, 340px);
      background: #eef2f4;
      border-radius: 8px;
      box-shadow:
        inset -1px -1px 0 rgba(90,110,130,0.5),
        inset 1px 1px 0 rgba(255,255,255,0.9),
        0 8px 24px rgba(20,40,60,0.35);
      overflow: hidden;
    }
    .retro-titlebar {
      background: linear-gradient(90deg, #5c86b8, #8fb6df 55%, #6d95c4);
      color: #fff;
      font-size: 11px;
      font-family: 'Microsoft JhengHei', sans-serif;
      padding: 6px 8px;
      display: flex; align-items: center; justify-content: space-between;
      letter-spacing: 0.03em;
    }
    .retro-titlebar .dots { display: flex; gap: 5px; }
    .retro-titlebar .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: linear-gradient(145deg, #fff, #b9c6d0);
      box-shadow: inset -1px -1px 1px rgba(0,0,0,0.25);
    }
    .retro-body {
      padding: 22px 18px 20px;
      text-align: center;
    }
    .retro-body .chrome-text.headline {
      font-size: clamp(26px, 8vw, 34px);
      display: block;
      line-height: 1.05;
    }
    .retro-path {
      margin-top: 6px;
      font-size: 10px;
      color: #5c6b78;
      font-family: monospace;
      opacity: 0.85;
    }
    .retro-progress {
      margin-top: 16px;
      height: 14px;
      background: #fff;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px #9fb3c0, inset 0 2px 3px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .retro-progress-fill {
      height: 100%; width: 2%;
      background-image: repeating-linear-gradient(115deg, #5b9bd5, #5b9bd5 10px, #8ec2ec 10px, #8ec2ec 20px);
      background-size: 32px 100%;
      animation: progress-stripe 0.7s linear infinite;
      transition: width 0.35s ease;
      border-radius: 3px 0 0 3px;
    }
    .retro-progress-label {
      margin-top: 6px;
      font-size: 10px;
      color: #46586a;
      font-family: monospace;
    }

    #loading-screen { z-index: 600; }

    #scan-hint {
      position: fixed; inset: 0; z-index: 550;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    @keyframes ring-spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
    @keyframes corner-glow {
      0%, 100% { filter: drop-shadow(0 0 3px rgba(180,220,255,0.6)) drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
      50% { filter: drop-shadow(0 0 9px rgba(180,220,255,1)) drop-shadow(0 1px 3px rgba(0,0,0,0.5)); }
    }

    .scan-reticle {
      /* 比例對應卡片實際尺寸 4501 x 6918（約 1:1.537），不是正方形 */
      position: relative;
      --reticle-w: min(74vw, 320px);
      width: var(--reticle-w);
      height: calc(var(--reticle-w) * 1.537);
      animation: pulse-scale 2.2s ease-in-out infinite;
    }
    .scan-ring {
      position: absolute; top: 50%; left: 50%;
      width: calc(var(--reticle-w) * 1.28);
      height: calc(var(--reticle-w) * 1.28);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.55);
      filter: drop-shadow(0 0 4px rgba(180,220,255,0.6));
      animation: ring-spin 9s linear infinite;
    }
    .scan-corner {
      position: absolute; width: 34px; height: 34px;
      border-color: #eaf5ff;
      animation: corner-glow 2.2s ease-in-out infinite;
    }
    .scan-corner.tl { top: 0; left: 0; border-top: 5px solid; border-left: 5px solid; border-radius: 8px 0 0 0; }
    .scan-corner.tr { top: 0; right: 0; border-top: 5px solid; border-right: 5px solid; border-radius: 0 8px 0 0; }
    .scan-corner.bl { bottom: 0; left: 0; border-bottom: 5px solid; border-left: 5px solid; border-radius: 0 0 0 8px; }
    .scan-corner.br { bottom: 0; right: 0; border-bottom: 5px solid; border-right: 5px solid; border-radius: 0 0 8px 0; }
    .scan-corner-spark {
      position: absolute; font-size: 16px; color: #fff;
      -webkit-text-stroke: 0.5px #9fb3c0;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
      animation: twinkle 1.8s ease-in-out infinite;
    }
    .scan-corner-spark.tl { top: -10px; left: -10px; }
    .scan-corner-spark.tr { top: -10px; right: -10px; animation-delay: 0.4s; }
    .scan-corner-spark.bl { bottom: -10px; left: -10px; animation-delay: 0.8s; }
    .scan-corner-spark.br { bottom: -10px; right: -10px; animation-delay: 1.2s; }
    .scan-line {
      position: absolute; left: 4%; right: 4%; height: 3px;
      background: linear-gradient(90deg, rgba(255,255,255,0), #cfe8ff, rgba(255,255,255,0));
      box-shadow: 0 0 12px 3px rgba(180,220,255,0.95);
      animation: scan-sweep 2.2s ease-in-out infinite;
    }
    .scan-banner {
      margin-top: 24px;
      display: flex; align-items: center; gap: 8px;
      background: #eef2f4;
      border-radius: 999px;
      padding: 9px 22px;
      box-shadow:
        inset -1px -1px 0 rgba(90,110,130,0.5),
        inset 1px 1px 0 rgba(255,255,255,0.9),
        0 6px 18px rgba(20,40,60,0.35);
      animation: pulse-scale 2.2s ease-in-out infinite;
    }
    .scan-banner .chrome-text {
      font-size: 16px;
    }
    .scan-banner-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #5b9bd5;
      animation: twinkle 1s ease-in-out infinite;
    }

    .tap-ripple {
      position: fixed; z-index: 700; pointer-events: none;
      width: 60px; height: 60px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.9);
      box-shadow: 0 0 10px rgba(180,220,255,0.8);
      transform: translate(-50%, -50%);
      animation: ripple-out 0.6s ease-out forwards;
    }
  </style>
  <script>
    // 轉一圈（ease-in-out，有加速煞車的速度感）→ 正面停留 → 再轉一圈，無限循環
    // 要調整速度/停留時間，改 rotate-with-pause 屬性裡的 duration / pause 數字（毫秒）就好
    AFRAME.registerComponent('rotate-with-pause', {
      schema: {
        duration: { type: 'number', default: 2000 }, // 轉一圈要花幾毫秒
        pause: { type: 'number', default: 3000 }      // 正面停留幾毫秒
      },
      init: function () {
        this.elapsed = 0;
        this.paused = false;
        this.pauseElapsed = 0;
      },
      easeInOutCubic: function (t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
      },
      tick: function (time, deltaTime) {
        if (this.paused) {
          this.pauseElapsed += deltaTime;
          if (this.pauseElapsed >= this.data.pause) {
            this.paused = false;
            this.pauseElapsed = 0;
            this.elapsed = 0;
          }
          return;
        }
        this.elapsed += deltaTime;
        var t = Math.min(this.elapsed / this.data.duration, 1);
        var eased = this.easeInOutCubic(t);
        this.el.object3D.rotation.y = eased * Math.PI * 2;
        if (t >= 1) {
          this.paused = true;
        }
      }
    });
  </script>
</head>
<body>
  <!-- ===== 讀取畫面：復古電腦視窗風格 ===== -->
  <div id="loading-screen" class="sky-bg">
    <div id="sparkle-layer"></div>
    <div class="retro-window">
      <div class="retro-titlebar">
        <span>Doctor_R1_ch.zip</span>
        <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
      <div class="retro-body">
        <span class="chrome-text headline">UNZIPPING</span>
        <div id="retro-path" class="retro-path">C:\NICE\Doctor_R1_ch.zip\ 解壓縮中...</div>
        <div class="retro-progress"><div id="progress-fill" class="retro-progress-fill"></div></div>
        <div id="progress-label" class="retro-progress-label">0 / 5 files extracted</div>
      </div>
    </div>
  </div>

  <!-- ===== 掃描提示畫面：找到卡片前顯示 ===== -->
  <div id="scan-hint">
    <div class="scan-reticle">
      <div class="scan-ring"></div>
      <div class="scan-corner tl"></div>
      <div class="scan-corner tr"></div>
      <div class="scan-corner bl"></div>
      <div class="scan-corner br"></div>
      <div class="scan-corner-spark tl">✦</div>
      <div class="scan-corner-spark tr">✧</div>
      <div class="scan-corner-spark bl">✧</div>
      <div class="scan-corner-spark br">✦</div>
      <div class="scan-line"></div>
    </div>
    <div class="scan-banner">
      <span class="scan-banner-dot"></span>
      <span class="chrome-text">掃描卡片 SCANNING...</span>
    </div>
  </div>

  <div class="example-container">
    <a-scene
      mindar-image="imageTargetSrc: assets/targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: true"
    >
      <a-assets>
        <a-asset-item id="r1" src="assets/r1.glb"></a-asset-item>
        <a-asset-item id="matsuko" src="assets/matsuko.glb"></a-asset-item>
        <a-asset-item id="bzhead" src="assets/bzhead.glb"></a-asset-item>
        <a-asset-item id="katt" src="assets/katt.glb"></a-asset-item>
        <a-asset-item id="wahaha" src="assets/wahaha.glb"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- 三點打光：基礎補光（弱）+ 主光（強，決定明暗立體感）+ 補光（對側，柔和不死黑）+ 輪廓光（背後，勾出邊緣質感） -->
      <a-entity light="type: ambient; color: #ffffff; intensity: 0.35"></a-entity>
      <a-entity light="type: directional; color: #fff4e0; intensity: 1.4" position="1 1.6 1"></a-entity>
      <a-entity light="type: directional; color: #cfe8ff; intensity: 0.45" position="-1 0.8 0.6"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.3" position="0 0.3 1"></a-entity>
      <a-entity light="type: directional; color: #ffffff; intensity: 0.9" position="-0.3 1.2 -1.2"></a-entity>

      <!-- targetIndex 對應上傳到 MindAR 編譯工具時的圖片順序（第一張是 0，第二張是 1，以此類推） -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          rotation="0 0 0"
          position="0.063 -1.740 0"
          scale="0.3 0.3 0.3"
          src="#r1"
          rotate-with-pause="duration: 2000; pause: 3000"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model
          rotation="0 0 0"
          position="0.012 -1.857 0"
          scale="0.3 0.3 0.3"
          src="#matsuko"
          rotate-with-pause="duration: 2000; pause: 3000"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 2">
        <a-gltf-model
          rotation="0 0 0"
          position="0 -1.556 0"
          scale="0.3 0.3 0.3"
          src="#bzhead"
          rotate-with-pause="duration: 2000; pause: 3000"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 3">
        <a-gltf-model
          rotation="0 0 0"
          position="0.028 -1.664 0"
          scale="0.3 0.3 0.3"
          src="#katt"
          rotate-with-pause="duration: 2000; pause: 3000"
        ></a-gltf-model>
      </a-entity>

      <a-entity mindar-image-target="targetIndex: 4">
        <a-gltf-model
          rotation="0 0 0"
          position="-0.030 -1.748 0"
          scale="0.3 0.3 0.3"
          src="#wahaha"
          rotate-with-pause="duration: 2000; pause: 3000"
        ></a-gltf-model>
      </a-entity>
    </a-scene>
  </div>

  <script>
    // 星星裝飾：隨機灑在讀取畫面四周，各自不同大小/位置/動畫延遲
    (function spawnSparkles() {
      var layer = document.getElementById('sparkle-layer');
      var glyphs = ['✦', '✧', '⋆'];
      var spots = [
        {top: '8%', left: '10%'}, {top: '14%', left: '82%'},
        {top: '78%', left: '14%'}, {top: '82%', left: '78%'},
        {top: '45%', left: '4%'}, {top: '40%', left: '92%'}
      ];
      spots.forEach(function (spot, i) {
        var el = document.createElement('div');
        el.className = 'sparkle';
        el.textContent = glyphs[i % glyphs.length];
        el.style.top = spot.top;
        el.style.left = spot.left;
        el.style.fontSize = (16 + (i % 3) * 8) + 'px';
        el.style.animationDelay = (i * 0.3) + 's, ' + (i * 0.4) + 's';
        layer.appendChild(el);
      });
    })();

    // 讀取進度：依實際 5 個模型檔案載入完成數量更新進度條，模擬解壓縮出每個角色的感覺
    (function trackLoading() {
      var total = 5;
      var loaded = 0;
      var fill = document.getElementById('progress-fill');
      var label = document.getElementById('progress-label');
      var pathEl = document.getElementById('retro-path');
      var ids = ['r1', 'matsuko', 'bzhead', 'katt', 'wahaha'];
      var displayNames = { r1: 'R1', matsuko: 'Matsuko', bzhead: 'Bzhead', katt: 'Katt', wahaha: 'Wahaha' };

      function bump(name) {
        loaded = Math.min(loaded + 1, total);
        var pct = Math.max(2, Math.round((loaded / total) * 100));
        fill.style.width = pct + '%';
        label.textContent = loaded + ' / ' + total + ' files extracted';
        pathEl.textContent = 'C:\\NICE\\Doctor_R1_ch.zip\\ ' + displayNames[name] + '.glb ✔ 解壓完成';
      }

      ids.forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('loaded', function () { bump(id); });
      });

      var sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('loaded', function () {
        fill.style.width = '100%';
        label.textContent = total + ' / ' + total + ' files extracted';
        pathEl.textContent = 'C:\\NICE\\Doctor_R1_ch.zip\\ 全員解壓縮完成！';
        setTimeout(function () {
          var screen = document.getElementById('loading-screen');
          screen.style.animation = 'fade-out 0.5s ease forwards';
        }, 350);
      });
    })();

    // 掃描提示：任一張卡片被辨識到就淡出提示，全部遺失時再淡入
    (function trackScanHint() {
      var hint = document.getElementById('scan-hint');
      var activeCount = 0;

      function updateHint() {
        hint.style.opacity = activeCount > 0 ? '0' : '1';
      }

      document.querySelectorAll('[mindar-image-target]').forEach(function (targetEl) {
        targetEl.addEventListener('targetFound', function () {
          activeCount++;
          updateHint();
        });
        targetEl.addEventListener('targetLost', function () {
          activeCount = Math.max(0, activeCount - 1);
          updateHint();
        });
      });
    })();

    // 互動小巧思：手指點畫面會有一圈漣漪效果
    document.addEventListener('pointerdown', function (e) {
      var ripple = document.createElement('div');
      ripple.className = 'tap-ripple';
      ripple.style.left = e.clientX + 'px';
      ripple.style.top = e.clientY + 'px';
      document.body.appendChild(ripple);
      setTimeout(function () { ripple.remove(); }, 650);
    });
  </script>
</body>
</html>
